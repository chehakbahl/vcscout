# Spring Boot General Configuration
server.port=8080
spring.application.name=vcscout-backend

# Primary Database Configuration: PostgreSQL (Commented out to use H2 fallback by default)
# spring.datasource.url=jdbc:postgresql://localhost:5432/vcscout
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Developer Fallback: Active by default for reliable sandbox database execution
spring.datasource.url=jdbc:h2:mem:vcscoutdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# JPA/Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# AI Agent Service Orchestration Connection URL
ai.service.url=http://localhost:8000
